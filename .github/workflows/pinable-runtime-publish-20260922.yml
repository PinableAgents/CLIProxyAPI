name: Publish verified Pinable runtime 20260922

on:
  push:
    branches: [release/pinable-runtime-20260922-2eb05786]
    paths: [.github/workflows/pinable-runtime-publish-20260922.yml]

permissions:
  contents: read

concurrency:
  group: pinable-runtime-release-20260922102929-2eb057869ca1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'PinableAgents/CLIProxyAPI' && github.ref == 'refs/heads/release/pinable-runtime-20260922-2eb05786'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the already-verified main source, not the publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 2eb057869ca11301edf1768e6ff68d8f95521e10
          persist-credentials: false
      - name: Run distribution and publication-validator regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/pinable -p 'test_*runtime.py' -v
      - name: Verify original CI and every asset, then publish the approved release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """One-time publication of the user-approved, already-verified main artifact."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import sys
          import tempfile
          import zipfile

          REPO = 'PinableAgents/CLIProxyAPI'
          SHA = '2eb057869ca11301edf1768e6ff68d8f95521e10'
          VERSION = '20260922102929-2eb057869ca1'
          TAG = 'pinable-runtime-' + VERSION
          RUN = 35716265457
          REGRESSION = 35716265484
          ARTIFACT = 10689356410
          DIGEST = '0a3974fd5acfb5982ae29c4f676eba4d8f4d1928de5649a3865420cfe3786165'


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def api(path, payload=None, method='POST'):
              args = ['gh', 'api', f'repos/{REPO}/{path}']
              if payload is not None:
                  args += ['--method', method, '--input', '-']
              result = subprocess.run(args, input=json.dumps(payload) if payload is not None else None,
                                      check=True, text=True, stdout=subprocess.PIPE, timeout=120)
              return json.loads(result.stdout)


          def verify_provenance():
              require(api('git/ref/heads/main')['object']['sha'] == SHA, 'main moved; do not publish stale binaries')
              for run_id, workflow in [(RUN, 'pinable-runtime.yml'), (REGRESSION, 'pinable-upstream-check.yml')]:
                  run = api(f'actions/runs/{run_id}')
                  require(run['head_sha'] == SHA and run['head_branch'] == 'main' and run['event'] == 'push'
                          and run['path'] == '.github/workflows/' + workflow
                          and run['status'] == 'completed' and run['conclusion'] == 'success', 'CI provenance mismatch')
              required_jobs = {'quality', 'Verify complete runtime set'} | {
                  f'Package {system}/{arch}' for system in ['windows', 'darwin', 'linux'] for arch in ['amd64', 'arm64']}
              jobs = api(f'actions/runs/{RUN}/jobs?per_page=100')['jobs']
              passed = {j['name'] for j in jobs if j['status'] == 'completed' and j['conclusion'] == 'success'}
              require(required_jobs <= passed, 'a native package or quality gate did not pass')
              artifact = api(f'actions/artifacts/{ARTIFACT}')
              require(artifact['name'] == 'pinable-runtime-all' and not artifact['expired']
                      and artifact['digest'] == 'sha256:' + DIGEST
                      and artifact['workflow_run']['id'] == RUN and artifact['workflow_run']['head_sha'] == SHA,
                      'artifact provenance mismatch')


          def unpack_verified(archive, directory):
              require(hashlib.sha256(archive.read_bytes()).hexdigest() == DIGEST, 'artifact ZIP digest mismatch')
              with zipfile.ZipFile(archive) as z:
                  entries = z.infolist()
                  require(len(entries) == 15 and len({e.filename for e in entries}) == 15, 'wrong artifact contents')
                  for e in entries:
                      require(not e.is_dir() and '/' not in e.filename and '\\' not in e.filename
                              and e.filename not in {'.', '..'} and not stat.S_ISLNK(e.external_attr >> 16)
                              and e.file_size < 150_000_000, 'unsafe artifact member')
                      (directory / e.filename).write_bytes(z.read(e))


          def main():
              require(os.environ.get('GITHUB_REPOSITORY') == REPO
                      and os.environ.get('GITHUB_REF') == 'refs/heads/release/pinable-runtime-20260922-2eb05786'
                      and os.environ.get('GITHUB_EVENT_NAME') == 'push', 'not the approved one-time publication')
              require(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == SHA,
                      'publication must validate with the original main code')
              sys.path.insert(0, str(Path('scripts/pinable').resolve()))
              from publish_runtime import validate
              verify_provenance()
              require(not any(r['ref'] == 'refs/tags/' + TAG for r in api('git/matching-refs/tags/' + TAG)),
                      'tag already exists; never overwrite a release')
              existing = api('releases?per_page=100')
              require(not any(r['tag_name'] == TAG for r in existing), 'release already exists; inspect before retrying')
              existing_ids = {r['id'] for r in existing}
              with tempfile.TemporaryDirectory() as temp:
                  archive = Path(temp) / 'artifact.zip'
                  directory = Path(temp) / 'runtime'
                  directory.mkdir()
                  with archive.open('wb') as output:
                      subprocess.run(['gh', 'api', f'repos/{REPO}/actions/artifacts/{ARTIFACT}/zip'],
                                     stdout=output, check=True, timeout=300)
                  unpack_verified(archive, directory)
                  index, files = validate(directory, SHA)
                  require(index['version'] == VERSION, 'unexpected runtime version')
                  hashes = {name: hashlib.sha256((directory / name).read_bytes()).hexdigest() for name in files}
                  sizes = {name: (directory / name).stat().st_size for name in files}
                  verify_provenance()
                  notes = f'''## Pinable Desktop runtime

          This release publishes the exact six-platform runtime set from verified main commit `{SHA}`.
          Version: `{VERSION}`. These are CLIProxyAPI component runtimes, not Desktop installers.

          | Platform | Architectures | Format |
          | --- | --- | --- |
          | Windows | amd64, arm64 | ZIP |
          | macOS | amd64, arm64 | tar.gz |
          | Linux | amd64, arm64 | tar.gz |

          Download the matching `CLIProxyAPI_pinable_*` archive. `runtime-index.json` identifies all targets;
          `SHA256SUMS` checks downloaded assets. Each archive also has a matching `.manifest.json`
          with separate archive and unpacked executable hashes. Preserve the approved source SHA and
          binary SHA256 in Desktop's component lock before using `CLIPROXYAPI_COMPONENT_ASSET`.

          ### Verification
          The existing main build passed full Go tests, 28 packaging/publication-policy tests,
          eight synchronization tests, repeated bootstrap regressions and all six native executable
          smoke checks. These include host contract v1, authentication separation, ephemeral keys
          surviving configuration replacement, authenticated shutdown and parent-exit shutdown.
          The original artifact digest, all archives, binary hashes and six native reports are rechecked
          before publication; each uploaded Release asset is verified before the draft is published.

          - [Six-platform build and checks](https://github.com/{REPO}/actions/runs/{RUN})
          - [Main regression checks](https://github.com/{REPO}/actions/runs/{REGRESSION})
          - [Desktop runtime integration](https://github.com/{REPO}/blob/{SHA}/docs/pinable/desktop-runtime.md)

          ### Compatibility and signing
          CGO=0 portable builds. macOS binaries are ad-hoc signed, not Developer ID signed or notarized;
          Windows binaries are unsigned. Unix dynamic-library plugins are unavailable in this profile;
          Windows keeps its DLL loader, but third-party plugins are not certified by these tests.
          No provider credentials are bundled or used for live-provider validation.
          Desktop locks and application signing are not changed automatically.
          '''
                  release = api('releases', {'tag_name': TAG, 'target_commitish': SHA,
                                'name': 'Pinable Desktop Runtime ' + VERSION, 'body': notes,
                                'draft': True, 'prerelease': False, 'make_latest': 'false'})
                  print(f"Draft release created: {release['id']}", flush=True)
                  subprocess.run(['gh', 'release', 'upload', TAG, '--repo', REPO,
                                  *[str(directory / name) for name in files]], check=True, timeout=600)
                  assets = api(f"releases/{release['id']}/assets?per_page=100")
                  require(len(assets) == len(files) and {a['name'] for a in assets} == set(files), 'uploaded asset set mismatch')
                  for asset in assets:
                      name = asset['name']
                      require(asset['state'] == 'uploaded' and asset['size'] == sizes[name]
                              and asset['digest'] == 'sha256:' + hashes[name], f'uploaded asset differs: {name}')
                  verify_provenance()
                  require({r['id'] for r in api('releases?per_page=100')} == existing_ids | {release['id']},
                          'concurrent release change; inspect before setting Latest')
                  result = api(f"releases/{release['id']}", {'draft': False, 'prerelease': False, 'make_latest': 'true'}, 'PATCH')
                  require(not result['draft'] and not result['prerelease'], 'release was not published')
                  require(api('git/ref/tags/' + TAG)['object']['sha'] == SHA, 'release tag points to unexpected source')
                  require(api('releases/latest')['id'] == release['id'], 'Latest does not match the published release')
                  print(result['html_url'], flush=True)
                  Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
                      f"# Published Latest runtime\n\n[{TAG}]({result['html_url']})\n\n"
                      f"Source: `{SHA}`\n\nAll {len(files)} assets verified by size and SHA256.\n", encoding='utf-8')


          if __name__ == '__main__':
              main()
          PY
