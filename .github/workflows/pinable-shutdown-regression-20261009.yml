name: Prove shutdown acknowledgement regression 20261009

on:
  push:
    branches: [maintenance/sync-20261009-67465884]
    paths: [.github/workflows/pinable-shutdown-regression-20261009.yml]

permissions:
  contents: read

jobs:
  regression:
    if: github.repository == 'PinableAgents/CLIProxyAPI'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      FIX_SHA: 2397d573c904fd6f5ccb42564938e8fb34af28dd
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fd6d88e404f5c4042825377c791c6fabdeadf3fa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: The new tests must detect the original unflushed response
        shell: bash
        run: |
          set -euo pipefail
          git show "$FIX_SHA:internal/api/handlers/management/runtime_shutdown_response_test.go" > internal/api/handlers/management/runtime_shutdown_response_test.go
          if go test ./internal/api/handlers/management -run '^TestPostRuntimeShutdown(WaitsForResponseFlush|AcknowledgesBeforeImmediateConnectionClose)$' -count=1 > "$RUNNER_TEMP/before.log" 2>&1; then
            cat "$RUNNER_TEMP/before.log"
            echo 'Negative control unexpectedly passed.' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/before.log"
          grep -F 'shutdown ran before the response was flushed' "$RUNNER_TEMP/before.log"
          grep -F 'shutdown acknowledgement was lost' "$RUNNER_TEMP/before.log"
      - name: The exact fix must pass all new cases under race detection
        shell: bash
        run: |
          set -euo pipefail
          git show "$FIX_SHA:internal/api/handlers/management/runtime.go" > internal/api/handlers/management/runtime.go
          go test -race ./internal/api/handlers/management -run '^TestPostRuntimeShutdown(WaitsForResponseFlush|AcknowledgesBeforeImmediateConnectionClose)$' -count=50
          printf '%s\n' 'Original implementation failed both deterministic regressions as expected; exact fix passed 50 repetitions with race detection. No branch or main was changed by this job.' >> "$GITHUB_STEP_SUMMARY"
