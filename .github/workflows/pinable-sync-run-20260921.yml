name: Pinable sync run 20260921

on:
  push:
    branches: [sync/upstream-20260921-a5ab69521f7b]
    paths: [.github/workflows/pinable-sync-run-20260921.yml]

permissions:
  contents: write

concurrency:
  group: pinable-sync-run-20260921
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'PinableAgents/CLIProxyAPI'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify fork baseline, target, and sync tooling
        shell: bash
        env:
          EXPECTED_BASE: 390fab7820295761d3e0991dfc1fdf8121dc9927
          EXPECTED_UPSTREAM: a5ab69521f7b4e0f244836d0419da8fcd89408ea
        run: |
          set -euo pipefail
          git config user.name 'Pinable sync'
          git config user.email 'noreply@pinable.cc'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch --no-tags upstream main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_UPSTREAM"
          bash -n scripts/pinable/sync-upstream.sh
          python3 scripts/pinable/test_sync_upstream.py -v
      - name: Merge pinned upstream and apply reviewed conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-ff --no-commit a5ab69521f7b4e0f244836d0419da8fcd89408ea
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' internal/runtime/executor/codex_stream_bootstrap_buffering_test.go > "$RUNNER_TEMP/expected-conflicts.txt"
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/actual-conflicts.txt"
            diff -u "$RUNNER_TEMP/expected-conflicts.txt" "$RUNNER_TEMP/actual-conflicts.txt"
            # Upstream independently fixed the same mock-clock ordering race that
            # Pinable carried as a temporary test-only patch. Keep the reviewed
            # upstream implementation so this fork no longer diverges in this file.
            git show a5ab69521f7b4e0f244836d0419da8fcd89408ea:internal/runtime/executor/codex_stream_bootstrap_buffering_test.go > internal/runtime/executor/codex_stream_bootstrap_buffering_test.go
            git add internal/runtime/executor/codex_stream_bootstrap_buffering_test.go
          fi
          test -z "$(git ls-files -u)"
          git diff --cached --check
      - name: Validate merged result
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/cli-proxy-api" ./cmd/server
          go test ./...
          go test ./internal/runtime/executor -run 'TestCodex(Websockets)?Executor_BootstrapBuffering_(TimeBudgetReleasesStream|OverloadDirectlyAfterTimeoutDeliveredInStream|StatusBearingErrorAfterTimeoutDeliveredInStream)$' -count=20
          "$RUNNER_TEMP/cli-proxy-api" --version
          "$RUNNER_TEMP/cli-proxy-api" discover --json --timeout 1 | python3 -m json.tool >/dev/null
          "$RUNNER_TEMP/cli-proxy-api" --discover-json --discover-timeout 1 | python3 -m json.tool >/dev/null
      - name: Commit and publish verified merge
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'Merge upstream a5ab69521f7b with Pinable host integration preserved' -m 'Adopt upstream bootstrap mock-clock synchronization and drop the equivalent fork-only test divergence.'
          git merge-base --is-ancestor a5ab69521f7b4e0f244836d0419da8fcd89408ea HEAD
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          git push origin HEAD:refs/heads/sync/upstream-20260921-a5ab69521f7b
