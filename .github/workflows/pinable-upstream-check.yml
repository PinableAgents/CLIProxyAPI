name: Pinable upstream check

on:
  push:
    branches: ['sync/upstream-*', main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinable-upstream-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'PinableAgents/CLIProxyAPI'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify synchronization baseline ancestry
        run: |
          git merge-base --is-ancestor 491e5413d084f74614f10834d63b76d288fb3e56 HEAD
          git merge-base --is-ancestor 61fdfc341b96178a8dcb53f2efc46cbc341d267c HEAD
      - name: Test safe synchronization script
        run: |
          bash -n scripts/pinable/sync-upstream.sh
          python3 scripts/pinable/test_sync_upstream.py -v
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build server
        run: go build -o "$RUNNER_TEMP/cli-proxy-api" ./cmd/server
      - name: Run regression tests
        run: go test ./...
      - name: Repeat timeout ordering regressions
        run: go test ./internal/runtime/executor -run 'TestCodex(Websockets)?Executor_BootstrapBuffering_(TimeBudgetReleasesStream|OverloadDirectlyAfterTimeoutDeliveredInStream|StatusBearingErrorAfterTimeoutDeliveredInStream)$' -count=20
      - name: Probe version and discovery output
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cli-proxy-api" --version
          "$RUNNER_TEMP/cli-proxy-api" discover --json --timeout 1 > "$RUNNER_TEMP/discovery.json"
          python3 -m json.tool "$RUNNER_TEMP/discovery.json" > /dev/null
          "$RUNNER_TEMP/cli-proxy-api" --discover-json --discover-timeout 1 > "$RUNNER_TEMP/legacy-discovery.json"
          python3 -m json.tool "$RUNNER_TEMP/legacy-discovery.json" > /dev/null
